<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>自己管理</title>
<style>
  :root {
    --bg: #14171c;
    --surface: #1b1f26;
    --surface-2: #222833;
    --line: #2c333e;
    --text: #e6e9ed;
    --muted: #8a939f;
    --faint: #5d6672;
    --habit-daily: #45b39d;
    --habit-weekly: #2f7a6d;
    --habit-tint: rgba(69,179,157,0.10);
    --task: #d8a13f;
    --task-tint: rgba(216,161,63,0.10);
    --dead: #6b7480;
    --alert: #d4664e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 15px; line-height: 1.5;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 88px);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ---- 上部バー ---- */
  .topbar { display: flex; justify-content: flex-end; padding: 10px 0 0; }
  .menubtn {
    width: 38px; height: 38px; border: none; border-radius: 10px;
    background: none; color: var(--muted); font-size: 19px; cursor: pointer;
  }
  .menubtn:active { background: var(--surface); }

  #alertBar {
    display: none; margin: 8px 0 0; padding: 11px 14px; border-radius: 10px;
    background: rgba(212,102,78,0.12); border: 1px solid rgba(212,102,78,0.35);
    color: #eda58f; font-size: 13.5px; cursor: pointer;
  }

  /* ---- 日付 ---- */
  .datebar { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 12px; }
  .navbtn {
    width: 38px; height: 38px; border: none; border-radius: 10px;
    background: var(--surface); color: var(--muted); font-size: 17px; cursor: pointer;
  }
  .navbtn:active { background: var(--surface-2); }
  .navbtn:disabled { opacity: .25; }
  .datelabel { text-align: center; }
  .datelabel .d { font-size: 21px; font-weight: 600; }
  .datelabel .sub { font-size: 12px; color: var(--faint); margin-top: 1px; }

  /* ---- サマリー ---- */
  .summary {
    background: var(--surface); border-radius: 12px; padding: 13px 15px;
    display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--muted);
  }
  .summary .row { display: flex; justify-content: space-between; }
  .summary .val { color: var(--text); font-variant-numeric: tabular-nums; }
  .locked { margin-top: 9px; font-size: 12px; color: var(--faint); }

  h2 { font-size: 12.5px; font-weight: 600; color: var(--faint); margin: 24px 0 9px; }

  /* ---- 行 ---- */
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--surface); border-left: 3px solid transparent;
    border-radius: 9px; padding: 12px 12px 12px 14px; margin-bottom: 7px;
  }
  .item.habit-daily  { border-left-color: var(--habit-daily); background: linear-gradient(var(--habit-tint),var(--habit-tint)), var(--surface); }
  .item.habit-weekly { border-left-color: var(--habit-weekly); }
  .item.task         { border-left-color: var(--task); background: linear-gradient(var(--task-tint),var(--task-tint)), var(--surface); }
  .item.deaditem     { border-left-color: var(--dead); opacity: .85; }

  .check {
    width: 22px; height: 22px; flex: 0 0 22px; margin-top: 1px;
    border: 1.5px solid var(--faint); border-radius: 6px;
    display: grid; place-items: center; font-size: 13px; color: transparent; cursor: pointer;
  }
  .item.habit-daily  .check.on { background: var(--habit-daily);  border-color: var(--habit-daily);  color: #10221e; }
  .item.habit-weekly .check.on { background: var(--habit-weekly); border-color: var(--habit-weekly); color: #0e1c19; }
  .item.task         .check.on { background: var(--task);         border-color: var(--task);         color: #221a08; }
  .check.disabled { opacity: .3; cursor: default; }

  .body { flex: 1; min-width: 0; cursor: pointer; }
  .title { font-size: 15px; }
  .item.done .title { color: var(--faint); text-decoration: line-through; }
  .meta { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .detail {
    font-size: 12.5px; color: var(--muted); margin-top: 5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .due { color: var(--alert); }

  /* ---- 2回タップの削除 ---- */
  .del {
    flex: 0 0 auto; background: none; border: 1px solid transparent; border-radius: 7px;
    color: var(--faint); font-size: 16px; padding: 3px 8px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .del.armed {
    font-size: 12px; color: var(--alert);
    border-color: rgba(212,102,78,.5); background: rgba(212,102,78,.1);
  }

  .empty { color: var(--faint); font-size: 13px; padding: 6px 2px 2px; }

  /* ---- 追加ボタン ---- */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    width: 100%; max-width: 528px; padding: 0 16px;
  }
  .fab button {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    background: var(--task); color: #221a08;
    font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }

  /* ---- メニュー ---- */
  .panel {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    transform: translateX(100%); transition: transform .22s ease;
    overflow-y: auto; padding: env(safe-area-inset-top) 0 40px;
  }
  .panel.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
  .panelhead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 6px;
  }
  .panelhead h1 { font-size: 17px; font-weight: 600; }

  .stats { display: flex; gap: 9px; }
  .stat { flex: 1; background: var(--surface); border-radius: 11px; padding: 13px 14px; }
  .stat .k { font-size: 11.5px; color: var(--faint); }
  .stat .v { font-size: 23px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat .n { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--surface-2); border-radius: 2px; margin-top: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--habit-daily); border-radius: 2px; }

  .lineBtn {
    width: 100%; padding: 12px; margin-top: 8px;
    background: none; border: 1px solid var(--line); border-radius: 10px;
    color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .lineBtn.danger { color: var(--alert); border-color: rgba(212,102,78,.35); }
  .revive {
    background: none; border: 1px solid var(--line); border-radius: 7px;
    color: var(--muted); font-size: 12px; padding: 5px 10px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
  }

  /* ---- シート ---- */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 40; }
  .sheet.open { display: flex; }
  .sheetbody {
    width: 100%; max-width: 560px; margin: 0 auto;
    background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 20px 18px calc(env(safe-area-inset-bottom) + 20px);
    max-height: 88vh; overflow-y: auto;
  }
  .sheetbody h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 13px 0 5px; }
  input, select, textarea {
    width: 100%; padding: 11px 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); font-size: 16px; font-family: inherit; line-height: 1.5;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--habit-weekly); }
  .two { display: flex; gap: 10px; }
  .two > div { flex: 1; }
  .sheetbtns { display: flex; gap: 9px; margin-top: 20px; }
  .sheetbtns button {
    flex: 1; padding: 13px; border-radius: 10px; border: none;
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .cancel { background: var(--surface-2); color: var(--muted); }
  .save   { background: var(--habit-daily); color: #10221e; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar"><button class="menubtn" id="menuBtn" aria-label="メニュー">☰</button></div>
  <div id="alertBar"></div>

  <div class="datebar">
    <button class="navbtn" id="prev">‹</button>
    <div class="datelabel">
      <div class="d" id="dateMain"></div>
      <div class="sub" id="dateSub"></div>
    </div>
    <button class="navbtn" id="next">›</button>
  </div>

  <div class="summary">
    <div class="row"><span>タスク</span><span class="val" id="sumCount"></span></div>
    <div class="row"><span>所要時間</span><span class="val" id="sumTime"></span></div>
    <div class="row"><span>習慣を全部やる場合</span><span class="val" id="sumHabitTime"></span></div>
  </div>
  <div class="locked" id="lockNote"></div>

  <h2>習慣</h2>
  <div id="habitList"></div>

  <h2>タスク</h2>
  <div id="taskList"></div>
</div>

<div class="fab"><button id="addTaskBtn">タスクを追加</button></div>

<!-- メニュー -->
<div class="panel" id="panel">
  <div class="wrap">
    <div class="panelhead">
      <h1>メニュー</h1>
      <button class="menubtn" id="panelClose" aria-label="閉じる">✕</button>
    </div>

    <h2>達成率</h2>
    <div class="stats">
      <div class="stat">
        <div class="k">今週</div><div class="v" id="wPct"></div>
        <div class="n" id="wNum"></div><div class="bar"><i id="wBar"></i></div>
      </div>
      <div class="stat">
        <div class="k">今月</div><div class="v" id="mPct"></div>
        <div class="n" id="mNum"></div><div class="bar"><i id="mBar"></i></div>
      </div>
    </div>

    <h2 id="deadHead">保留中のタスク</h2>
    <div id="deadList"></div>

    <h2>習慣</h2>
    <div id="habitManage"></div>
    <button class="lineBtn" id="addHabitBtn">習慣を追加</button>

    <h2>データ</h2>
    <button class="lineBtn" id="exportBtn">データを書き出す</button>
    <button class="lineBtn danger" id="resetBtn">記録を全部消す</button>
  </div>
</div>

<!-- タスクの追加・編集 -->
<div class="sheet" id="taskSheet">
  <div class="sheetbody">
    <h3 id="tHead">タスクを追加</h3>
    <label for="tTitle">やること</label>
    <input id="tTitle" placeholder="例：簿記の問題を解く">
    <label for="tDetail">詳細</label>
    <textarea id="tDetail" placeholder="手順、参考リンク、気をつけることなど"></textarea>
    <div class="two">
      <div>
        <label for="tMin">所要時間（分）</label>
        <input id="tMin" type="number" value="2" min="1">
      </div>
      <div>
        <label for="tDue">締切（任意）</label>
        <input id="tDue" type="date">
      </div>
    </div>
    <div class="sheetbtns">
      <button class="cancel" data-close="taskSheet">やめる</button>
      <button class="save" id="tSave">保存する</button>
    </div>
  </div>
</div>

<!-- 習慣の追加 -->
<div class="sheet" id="habitSheet">
  <div class="sheetbody">
    <h3>習慣を追加</h3>
    <label for="hTitle">続けたいこと</label>
    <input id="hTitle" placeholder="例：ストレッチ">
    <div class="two">
      <div>
        <label for="hMode">頻度</label>
        <select id="hMode">
          <option value="daily">毎日</option>
          <option value="weekly">週に何回か</option>
        </select>
      </div>
      <div id="targetWrap" style="display:none">
        <label for="hTarget">週の回数</label>
        <input id="hTarget" type="number" value="3" min="1" max="7">
      </div>
    </div>
    <label for="hMin">1回の所要時間（分）</label>
    <input id="hMin" type="number" value="2" min="1">
    <div class="sheetbtns">
      <button class="cancel" data-close="habitSheet">やめる</button>
      <button class="save" id="hSave">追加する</button>
    </div>
  </div>
</div>

<script>
/* ========== 保存 ========== */
const KEY = 'selfmgmt.v1';
const BOUNDARY_HOUR = 3, BOUNDARY_MIN = 30;
const EDIT_DAYS = 3, DUE_SOON = 3;
let db;

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); migrate(); return; } }
  catch (e) {}
  db = seed(); save();
}
function migrate() {
  db.habits ||= []; db.tasks ||= []; db.logs ||= {};
  db.tasks.forEach(t => { if (t.detail === undefined) t.detail = ''; });
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('保存できませんでした。保存領域がいっぱいかもしれません。'); }
}
function seed() {
  const t = todayStr();
  return {
    habits: [
      { id: uid(), title: 'ストレッチ', mode: 'daily',  target: 7, minutes: 5 },
      { id: uid(), title: 'ランニング', mode: 'weekly', target: 3, minutes: 30 }
    ],
    logs: {},
    tasks: [
      { id: uid(), title: '簿記2級の問題演習', detail: '第3問の精算表まで', minutes: 45, date: t, done: false, carried: 0, dead: false, due: null },
      { id: uid(), title: '図書館に本を返す', detail: '', minutes: 2, date: t, done: false, carried: 0, dead: false, due: addDays(t, 2) }
    ]
  };
}
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ========== 日付 ========== */
function todayStr() {
  const n = new Date();
  n.setHours(n.getHours() - BOUNDARY_HOUR, n.getMinutes() - BOUNDARY_MIN);
  return fmt(n);
}
function fmt(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 86400000); }
function mondayOf(s) { const d = parse(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return fmt(d); }
const WD = ['日','月','火','水','木','金','土'];
function label(s) {
  const d = parse(s), g = diffDays(s, todayStr());
  return {
    main: (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）',
    sub: g === 0 ? '今日' : g === -1 ? '昨日' : g === 1 ? '明日' : ''
  };
}
function canEdit(s) { const g = diffDays(todayStr(), s); return g >= 0 && g <= EDIT_DAYS; }
function hm(min) {
  if (min < 60) return min + '分';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? h + '時間' + m + '分' : h + '時間';
}

/* ========== 繰り越し ========== */
function rollover() {
  const t = todayStr(); let ch = false;
  db.tasks.forEach(x => {
    if (x.done || x.dead || x.date >= t) return;
    if (x.carried === 0) { x.date = t; x.carried = 1; } else { x.dead = true; }
    ch = true;
  });
  if (ch) save();
}

/* ========== 集計 ========== */
const loggedOn = d => db.logs[d] || [];
const isLogged = (h, d) => loggedOn(d).includes(h);
function rate(fromMonday, weeks) {
  let num = 0, den = 0;
  for (let w = 0; w < weeks; w++) {
    const start = addDays(fromMonday, w * 7);
    db.habits.forEach(h => {
      const target = h.mode === 'daily' ? 7 : h.target;
      let hit = 0;
      for (let i = 0; i < 7; i++) if (isLogged(h.id, addDays(start, i))) hit++;
      num += Math.min(hit, target); den += target;
    });
  }
  return { num, den, pct: den ? Math.round(num / den * 100) : 0 };
}
const weekRate = d => rate(mondayOf(d), 1);
function monthRate(d) {
  const p = parse(d), y = p.getFullYear(), m = p.getMonth();
  let cur = mondayOf(fmt(new Date(y, m, 1)));
  if (parse(cur).getMonth() !== m) cur = addDays(cur, 7);
  let weeks = 0, scan = cur;
  while (parse(scan).getMonth() === m && parse(scan).getFullYear() === y) { weeks++; scan = addDays(scan, 7); }
  return rate(cur, weeks);
}

/* ========== 2回タップの削除 ========== */
let armed = null, armTimer = null;
function delButton(id, onDelete) {
  const b = document.createElement('button');
  b.className = 'del' + (armed === id ? ' armed' : '');
  b.textContent = armed === id ? '削除する' : '×';
  b.onclick = e => {
    e.stopPropagation();
    clearTimeout(armTimer);
    if (armed === id) { armed = null; onDelete(); return; }
    armed = id;
    render();
    armTimer = setTimeout(() => { armed = null; render(); }, 3500);
  };
  return b;
}

/* ========== 描画 ========== */
let view = todayStr();

function render() {
  const editable = canEdit(view);
  const L = label(view);
  document.getElementById('dateMain').textContent = L.main;
  document.getElementById('dateSub').textContent = L.sub;
  document.getElementById('next').disabled = diffDays(view, todayStr()) >= 0;
  document.getElementById('lockNote').textContent = editable ? ''
    : (diffDays(view, todayStr()) > 0 ? '未来の日は記録できません。' : EDIT_DAYS + '日より前は変更できません。');

  /* 習慣 */
  const hl = document.getElementById('habitList'); hl.innerHTML = '';
  if (!db.habits.length) hl.innerHTML = '<div class="empty">習慣はまだありません。メニューから追加できます。</div>';
  db.habits.forEach(h => {
    let meta = h.minutes + '分';
    if (h.mode === 'weekly') {
      const ws = mondayOf(view); let hit = 0;
      for (let i = 0; i < 7; i++) if (isLogged(h.id, addDays(ws, i))) hit++;
      meta += ' ・ 今週 ' + hit + '/' + h.target + '回';
    }
    const el = document.createElement('div');
    el.className = 'item ' + (h.mode === 'daily' ? 'habit-daily' : 'habit-weekly') + (isLogged(h.id, view) ? ' done' : '');
    el.append(checkbox(isLogged(h.id, view), editable, () => toggleHabit(h.id)), bodyBlock(h.title, meta, ''));
    hl.appendChild(el);
  });

  /* タスク */
  const list = db.tasks.filter(x => !x.dead && x.date === view);
  const tl = document.getElementById('taskList'); tl.innerHTML = '';
  if (!list.length) tl.innerHTML = '<div class="empty">タスクはありません。</div>';
  list.forEach(x => {
    let meta = x.minutes + '分';
    if (x.carried) meta += ' ・ 繰り越し';
    if (x.due) meta += ' ・ 締切 ' + x.due.slice(5).replace('-', '/');
    const el = document.createElement('div');
    el.className = 'item task' + (x.done ? ' done' : '');
    const body = bodyBlock(x.title, meta, x.detail);
    body.onclick = () => openTask(x.id);
    el.append(
      checkbox(x.done, editable, () => { x.done = !x.done; save(); render(); }),
      body,
      delButton(x.id, () => { db.tasks = db.tasks.filter(y => y.id !== x.id); save(); render(); })
    );
    tl.appendChild(el);
  });

  /* サマリー */
  const doneN = list.filter(x => x.done).length;
  const total = list.reduce((s, x) => s + x.minutes, 0);
  const left = list.filter(x => !x.done).reduce((s, x) => s + x.minutes, 0);
  const hMin = db.habits.filter(h => !isLogged(h.id, view)).reduce((s, h) => s + h.minutes, 0);
  document.getElementById('sumCount').textContent = doneN + ' / ' + list.length + ' 件';
  document.getElementById('sumTime').textContent = '残り ' + hm(left) + ' / 合計 ' + hm(total);
  document.getElementById('sumHabitTime').textContent = '+ ' + hm(hMin);

  renderPanel();
  renderAlert();
}

function checkbox(on, editable, fn) {
  const c = document.createElement('div');
  c.className = 'check' + (on ? ' on' : '') + (editable ? '' : ' disabled');
  c.textContent = '✓';
  if (editable) c.onclick = e => { e.stopPropagation(); fn(); };
  return c;
}
function bodyBlock(title, meta, detail) {
  const b = document.createElement('div');
  b.className = 'body';
  const t = document.createElement('div'); t.className = 'title'; t.textContent = title;
  const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta;
  b.append(t, m);
  if (detail) { const d = document.createElement('div'); d.className = 'detail'; d.textContent = detail; b.appendChild(d); }
  return b;
}
function toggleHabit(hid) {
  const arr = db.logs[view] || [];
  const i = arr.indexOf(hid);
  if (i >= 0) arr.splice(i, 1); else arr.push(hid);
  db.logs[view] = arr;
  if (!arr.length) delete db.logs[view];
  save(); render();
}

/* ---- メニュー内 ---- */
function renderPanel() {
  const w = weekRate(view), m = monthRate(view);
  document.getElementById('wPct').textContent = w.pct + '%';
  document.getElementById('wNum').textContent = w.num + ' / ' + w.den + ' 回';
  document.getElementById('wBar').style.width = w.pct + '%';
  document.getElementById('mPct').textContent = m.pct + '%';
  document.getElementById('mNum').textContent = m.num + ' / ' + m.den + ' 回';
  document.getElementById('mBar').style.width = m.pct + '%';

  const dead = db.tasks.filter(x => x.dead);
  document.getElementById('deadHead').textContent = '保留中のタスク（' + dead.length + '）';
  const box = document.getElementById('deadList'); box.innerHTML = '';
  if (!dead.length) box.innerHTML = '<div class="empty">保留中のタスクはありません。</div>';
  const order = [...dead.filter(x => x.due).sort((a, b) => a.due < b.due ? -1 : 1), ...dead.filter(x => !x.due)];
  order.forEach(x => {
    const el = document.createElement('div');
    el.className = 'item deaditem';
    let meta = x.minutes + '分' + (x.due ? ' ・ 締切 ' + x.due.slice(5).replace('-', '/') : '');
    const b = bodyBlock(x.title, meta, x.detail);
    if (x.due && diffDays(x.due, todayStr()) <= DUE_SOON) b.querySelector('.meta').classList.add('due');
    b.onclick = () => openTask(x.id);
    const r = document.createElement('button');
    r.className = 'revive'; r.textContent = '今日に戻す';
    r.onclick = e => { e.stopPropagation(); x.dead = false; x.done = false; x.carried = 0; x.date = todayStr(); save(); render(); };
    el.append(b, r, delButton(x.id, () => { db.tasks = db.tasks.filter(y => y.id !== x.id); save(); render(); }));
    box.appendChild(el);
  });

  const hm2 = document.getElementById('habitManage'); hm2.innerHTML = '';
  if (!db.habits.length) hm2.innerHTML = '<div class="empty">習慣はまだありません。</div>';
  db.habits.forEach(h => {
    const el = document.createElement('div');
    el.className = 'item ' + (h.mode === 'daily' ? 'habit-daily' : 'habit-weekly');
    el.append(
      bodyBlock(h.title, h.mode === 'daily' ? '毎日 ・ ' + h.minutes + '分' : '週' + h.target + '回 ・ ' + h.minutes + '分', ''),
      delButton(h.id, () => { db.habits = db.habits.filter(y => y.id !== h.id); save(); render(); })
    );
    hm2.appendChild(el);
  });
}

function renderAlert() {
  const soon = db.tasks.filter(x => x.dead && x.due && diffDays(x.due, todayStr()) <= DUE_SOON);
  const bar = document.getElementById('alertBar');
  if (!soon.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  bar.textContent = '締切が近い保留タスクが ' + soon.length + ' 件あります。';
  bar.onclick = () => openPanel();
}

/* ========== 操作 ========== */
document.getElementById('prev').onclick = () => { view = addDays(view, -1); render(); };
document.getElementById('next').onclick = () => { if (diffDays(view, todayStr()) < 0) { view = addDays(view, 1); render(); } };

const panel = document.getElementById('panel');
const openPanel = () => { renderPanel(); panel.classList.add('open'); };
document.getElementById('menuBtn').onclick = openPanel;
document.getElementById('panelClose').onclick = () => panel.classList.remove('open');

let sx = 0, sy = 0;
document.body.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, { passive: true });
document.body.addEventListener('touchend', e => {
  if (panel.classList.contains('open')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
  if (dx < 0) { if (diffDays(view, todayStr()) < 0) { view = addDays(view, 1); render(); } }
  else { view = addDays(view, -1); render(); }
}, { passive: true });

const open = id => document.getElementById(id).classList.add('open');
const close = id => document.getElementById(id).classList.remove('open');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => close(b.dataset.close));
document.querySelectorAll('.sheet').forEach(s => s.onclick = e => { if (e.target === s) s.classList.remove('open'); });

/* タスクの追加・編集 */
let editingId = null;
document.getElementById('addTaskBtn').onclick = () => {
  editingId = null;
  document.getElementById('tHead').textContent = 'タスクを追加';
  document.getElementById('tTitle').value = '';
  document.getElementById('tDetail').value = '';
  document.getElementById('tMin').value = 2;
  document.getElementById('tDue').value = '';
  open('taskSheet');
};
function openTask(id) {
  const x = db.tasks.find(t => t.id === id); if (!x) return;
  editingId = id;
  document.getElementById('tHead').textContent = 'タスクを編集';
  document.getElementById('tTitle').value = x.title;
  document.getElementById('tDetail').value = x.detail || '';
  document.getElementById('tMin').value = x.minutes;
  document.getElementById('tDue').value = x.due || '';
  open('taskSheet');
}
document.getElementById('tSave').onclick = () => {
  const title = document.getElementById('tTitle').value.trim();
  if (!title) { document.getElementById('tTitle').focus(); return; }
  const detail = document.getElementById('tDetail').value.trim();
  const minutes = Math.max(1, parseInt(document.getElementById('tMin').value) || 2);
  const due = document.getElementById('tDue').value || null;
  if (editingId) {
    const x = db.tasks.find(t => t.id === editingId);
    Object.assign(x, { title, detail, minutes, due });
  } else {
    db.tasks.push({ id: uid(), title, detail, minutes, date: canEdit(view) ? view : todayStr(), done: false, carried: 0, dead: false, due });
  }
  save(); close('taskSheet'); render();
};

/* 習慣の追加 */
document.getElementById('hMode').onchange = e => {
  document.getElementById('targetWrap').style.display = e.target.value === 'weekly' ? 'block' : 'none';
};
document.getElementById('addHabitBtn').onclick = () => {
  document.getElementById('hTitle').value = '';
  document.getElementById('hMin').value = 2;
  document.getElementById('hMode').value = 'daily';
  document.getElementById('targetWrap').style.display = 'none';
  open('habitSheet');
};
document.getElementById('hSave').onclick = () => {
  const title = document.getElementById('hTitle').value.trim();
  if (!title) { document.getElementById('hTitle').focus(); return; }
  const mode = document.getElementById('hMode').value;
  db.habits.push({
    id: uid(), title, mode,
    target: mode === 'daily' ? 7 : Math.min(7, Math.max(1, parseInt(document.getElementById('hTarget').value) || 3)),
    minutes: Math.max(1, parseInt(document.getElementById('hMin').value) || 2)
  });
  save(); close('habitSheet'); render();
};

/* データ */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'selfmgmt-' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('記録をすべて消して最初の状態に戻します。よろしいですか？')) return;
  localStorage.removeItem(KEY); load(); view = todayStr(); render();
};

/* 起動 */
load(); rollover(); view = todayStr(); render();
setInterval(() => { const t = todayStr(); if (diffDays(view, t) > 0) view = t; rollover(); render(); }, 60000);
</script>
</body>
</html>
